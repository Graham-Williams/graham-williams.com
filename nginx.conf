# graham-williams.com — full nginx config for the nginx-unprivileged image.
# Listens on 8080 as a non-root user; reached only through the Cloudflare
# tunnel, which forwards the original Host header.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30;
  server_tokens off;

  # Writable paths for the unprivileged image (the rootfs is read-only).
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp_path;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  gzip on;
  gzip_types text/css image/svg+xml text/plain;
  gzip_min_length 512;

  # www → apex.
  server {
    listen 8080;
    server_name www.graham-williams.com;
    include /etc/nginx/snippets/security-headers.conf;
    return 301 https://graham-williams.com$request_uri;
  }

  server {
    listen 8080 default_server;
    server_name graham-williams.com _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /404.html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Font files never change under the same name: cache them for a year.
    location /static/fonts/ {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Stylesheet and icon: short cache so edits show up within minutes.
    location /static/ {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "public, max-age=300" always;
      try_files $uri =404;
    }

    location / {
      include /etc/nginx/snippets/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ =404;
    }
  }
}
