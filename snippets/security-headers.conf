# Included in every location that sets its own add_header, because nginx's
# add_header does not inherit once a block adds any header of its own.
add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# HSTS for this host only. Deliberately no includeSubDomains (each app owns its
# own policy) and no preload.
add_header Strict-Transport-Security "max-age=31536000" always;
